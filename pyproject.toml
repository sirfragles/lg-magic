[project]
name = "lg-magic"
version = "1.1.0-dev"
description = "LG Magic Remote (MR20) Linux Kernel Driver and Tools"
readme = "README.md"
license = { text = "GPL-2.0-only" }
authors = [
    { name = "Ilya Chelyadin", email = "ilya77105@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pyqtgraph>=0.13.0",
    "evdev>=1.6.0",
    "AHRS>=2.1.0",
    "python-uinput>=1.0.0",
    "trimesh>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (unused imports, etc.)
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# E701: compact if/elif in event loop is intentional style
# SIM115: csvfile kept open for write loop (legacy compat)
"scripts/display_imu.py" = ["E701", "SIM115"]
# SIM108: if/else for division-by-zero is more readable than ternary
"scripts/draw_cube.py" = ["SIM108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
